<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restoran Bella</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  line-height: 1.6;
}

header {
  min-height: 90vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px;
  background:
    linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.75)),url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1600&q=80")
    center/cover;
}

.hero h1 {
  font-size: 55px;
  margin-bottom: 15px;
}

.hero p {
  font-size: 20px;
  margin-bottom: 30px;
}

.button {
  display: inline-block;
  padding: 14px 28px;
  background: #d4a017;
  color: white;
  text-decoration: none;
  border-radius: 30px;
  font-weight: bold;
}

section {
  padding: 70px 20px;
  max-width: 1100px;
  margin: auto;
}

h2 {
  text-align: center;
  font-size: 35px;
  margin-bottom: 40px;
}.menu {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(230px,1fr));
  gap: 20px;
}

.card {
  background: #1d1d1d;
  padding: 25px;
  border-radius: 15px;
}

.card h3 {
  color: #d4a017;
  margin-bottom: 8px;
}

.price {
  font-weight: bold;
  margin-top: 12px;
}

.contact {
  text-align: center;
  background: #181818;
  max-width: none;
}

footer {
  text-align: center;
  padding: 25px;
  background: #080808;
  color: #aaa;
}

@media(max-width:600px) {
  .hero h1 {
    font-size: 40px;
  }
}
</style>
</head><body>

<header>
  <div class="hero">
    <h1>Restoran Bella</h1>
    <p>Ukusi koje ćete pamtiti.</p>
    <a href="#kontakt" class="button">Rezerviši sto</a>
  </div>
</header>

<section>
  <h2>Naš meni</h2>

  <div class="menu">
